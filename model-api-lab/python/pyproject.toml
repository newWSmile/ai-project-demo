[project]
name = "model-api-lab-python"
version = "0.1.0"
description = "模型 API 学习项目的 Python 实验"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28,<1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# 当前目录有两个有意保留的顶层脚本，显式声明可避免 setuptools 拒绝 flat-layout 自动发现。
py-modules = ["direct_model_call", "call_java_service"]
