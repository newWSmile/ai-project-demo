spring:
  application:
    name: model-api-lab
  ai:
    model:
      chat: openai
      embedding: none
    openai:
      api-key: ${DASHSCOPE_API_KEY:${MODEL_API_KEY:change-me}}
      base-url: ${MODEL_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      chat:
        model: ${MODEL_NAME:qwen-plus}
        temperature: ${MODEL_TEMPERATURE:0.2}
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 500ms
        multiplier: 2
        max-interval: 5s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
